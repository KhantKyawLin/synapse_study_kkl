<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Study - Universal Dashboard</title>
    <meta name="description"
        content="Study medical detailed data on Synapse Study Dashboards.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX for Medical/Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="app-container dashboard-layout">
        <!-- Sidebar / Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-wrapper">
                    <img src="logo.jpg" alt="Synapse Study Logo" class="app-logo">
                </div>
                <h1 class="logo-text"><span>SYNAPSE</span> STUDY</h1>
            </div>
            
            <!-- Navigation Links -->
            <nav class="app-nav">
                <a href="index.html" class="nav-link">Flashcards</a>
                <a href="dashboard.html" class="nav-link active">Dashboards</a>
            </nav>

            <div class="controls-container">
                <label for="moduleFilter" class="form-label visually-hidden">Module</label>
                <select id="moduleFilter" class="form-select category-select">
                    <!-- Options populated dynamically -->
                </select>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="dashboard-main container-fluid">
            <div class="row h-100">
                <!-- LEFT SIDEBAR -->
                <div class="col-md-4 col-lg-3 dashboard-sidebar">
                    <h2 class="sidebar-title">Items</h2>
                    
                    <div id="tagFilters" class="tag-filters">
                        <!-- Dynamic filter buttons -->
                    </div>
                    
                    <div class="item-select-container mb-3">
                        <label for="itemSelect" class="form-label visually-hidden">Select Item</label>
                        <select id="itemSelect" class="form-select category-select item-select-dropdown">
                            <!-- Dynamic item options -->
                        </select>
                    </div>

                    <div class="item-list-container d-none">
                        <ul id="itemList" class="item-list">
                            <!-- Dynamic list items -->
                        </ul>
                    </div>
                </div>

                <!-- RIGHT CONTENT AREA -->
                <div class="col-md-8 col-lg-9 dashboard-content">
                    <div id="detailView" class="detail-view">
                        <div class="empty-state text-center">
                            <p>Loading module data...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS Bundle-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="dashboard.js?v=1"></script>
</body>

</html>
